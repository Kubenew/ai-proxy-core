[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-proxy-core"
version = "0.1.1"
description = "AI-assisted reverse proxy core: anomaly detection, adaptive routing, traffic shaping, observability."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Kubenew"}]
keywords = ["ai", "proxy", "reverse-proxy", "anomaly-detection", "load-balancing", "asyncio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Networking",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "typer>=0.12.3",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.27.0",
]
dev = ["ai-proxy-core[test]", "ruff>=0.1"]

[project.urls]
Homepage = "https://github.com/Kubenew/ai-proxy-core"
Source = "https://github.com/Kubenew/ai-proxy-core"
Issues = "https://github.com/Kubenew/ai-proxy-core/issues"

[project.scripts]
ai-proxy = "ai_proxy_core.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["ai_proxy_core"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
